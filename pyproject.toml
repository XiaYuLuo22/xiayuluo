[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xiayuluo-assistant"
version = "0.1.17"
description = "An extensible local assistant with streaming chat, Codex, and desktop tools."
license-files = ["THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
app = ["pywebview==6.2.1"]
build = ["pyinstaller==6.22.3"]
desktop = ["PyAutoGUI==0.9.54", "Pillow>=11,<13"]
control = ["transitions==0.9.3", "mss==10.2.0", "opencv-python-headless==4.14.0.94", "numpy==2.4.2"]
voice = ["vosk==0.3.45; sys_platform == 'win32'", "sounddevice==0.5.6; sys_platform == 'win32'", "pyttsx3==2.99; sys_platform == 'win32'"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "Pillow>=11,<13"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
xiayuluo = "assistant.__main__:main"
xiayuluo-cloud = "cloud_sync.__main__:main"

[project.gui-scripts]
xiayuluo-app = "assistant.desktop_app:main"

[tool.setuptools.packages.find]
include = ["assistant*", "cloud_sync*"]

[tool.setuptools.package-data]
assistant = ["static/*", "static/vendor/*", "update-config.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
