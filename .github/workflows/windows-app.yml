name: Build Windows desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned app dependencies
        run: python -m pip install -c requirements.lock -e ".[app,desktop,voice,build,test]"
      - name: Validate backend and desktop lifecycle
        run: python -m pytest -q --junitxml=windows-tests.xml tests/test_memory.py tests/test_api.py tests/test_config.py tests/test_tools.py tests/test_mouse.py tests/test_mouse_api.py tests/test_single_instance.py tests/test_desktop_app.py tests/test_bootstrap_windows.py tests/test_mobile.py tests/test_updates.py tests/test_offline_updates.py tests/test_update_ownership.py tests/test_packaged_smoke.py tests/test_codex_chat.py tests/test_voice.py tests/test_speech.py tests/test_speech_api.py tests/test_voice_consent.py tests/test_automation.py tests/test_ci_reports.py
      - name: Report exact Windows test failures
        if: failure()
        run: python tools/report_ci_tests.py windows-tests.xml
      - name: Prepare official offline Chinese voice model
        run: python tools/prepare_voice_model.py
      - name: Build desktop app
        run: python tools/run_ci_command.py python tools/build_desktop.py --installer
      - uses: actions/upload-artifact@v4
        with:
          name: Xiayuluo-Windows
          path: |
            dist/desktop/Xiayuluo-Windows.zip
            dist/desktop/Xiayuluo-Setup.exe
          if-no-files-found: error
