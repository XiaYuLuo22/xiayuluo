name: Build Windows desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned app dependencies
        run: python -m pip install -c requirements.lock -e ".[app,desktop,build,test]"
      - name: Validate backend and desktop lifecycle
        run: python -m pytest -q tests/test_memory.py tests/test_api.py tests/test_config.py tests/test_tools.py tests/test_desktop_app.py tests/test_bootstrap_windows.py tests/test_mobile.py tests/test_updates.py tests/test_codex_chat.py
      - name: Build desktop app
        run: python tools/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: Xiayuluo-Windows
          path: dist/desktop/Xiayuluo-Windows.zip
          if-no-files-found: error
