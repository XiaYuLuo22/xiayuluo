name: Build Windows desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned app dependencies
        run: python -m pip install -c requirements.lock -e ".[app,desktop,voice,build,test]"
      - name: Validate backend and desktop lifecycle
        run: python -m pytest -q --junitxml=windows-tests.xml tests/test_memory.py tests/test_api.py tests/test_config.py tests/test_tools.py tests/test_mouse.py tests/test_mouse_api.py tests/test_proactive.py tests/test_proactive_api.py tests/test_single_instance.py tests/test_desktop_app.py tests/test_bootstrap_windows.py tests/test_mobile.py tests/test_updates.py tests/test_offline_updates.py tests/test_update_ownership.py tests/test_training_storage.py tests/test_training_backup.py tests/test_training_api.py tests/test_training_updates.py tests/test_training_data_cli.py tests/test_packaged_smoke.py tests/test_codex_chat.py tests/test_voice.py tests/test_speech.py tests/test_speech_api.py tests/test_voice_consent.py tests/test_automation.py tests/test_ci_reports.py
      - name: Report exact Windows test failures
        if: failure()
        run: python tools/report_ci_tests.py windows-tests.xml
      - name: Validate activity, cloud sync and encrypted backup boundaries
        run: python tools/run_ci_command.py python -m pytest -q tests/test_activity_context.py tests/test_activity_api.py tests/test_cloud_client.py tests/test_cloud_replica.py tests/test_cloud_bridge.py tests/test_cloud_runtime.py tests/test_cloud_sync_server.py tests/test_cloud_end_to_end.py tests/test_cloud_crash_recovery.py tests/test_cloud_tasks.py tests/test_cloud_task_api.py tests/test_github_backup.py
      - name: Prepare official offline Chinese voice model
        run: python tools/prepare_voice_model.py
      - name: Validate online update startup and publication gates
        run: python tools/run_ci_command.py python -m pytest -q tests/test_online_update_completion.py tests/test_update_startup_gate.py tests/test_release_publish_validation.py tests/test_release_android.py tests/test_android_build.py tests/test_release_checks.py
      - name: Build desktop app
        run: python tools/run_ci_command.py python tools/build_desktop.py --installer
      - uses: actions/upload-artifact@v4
        with:
          name: Xiayuluo-Windows
          path: |
            dist/desktop/Xiayuluo-Windows.zip
            dist/desktop/Xiayuluo-Setup.exe
          if-no-files-found: error
